name: ShyTalk-01 Android Debug APK

# Safe local-only diagnostic APK. No original ShyTalk production/dev credentials.
on:
  workflow_dispatch:
  push:
    branches:
      - work/shytalk-01-debug-apk
    paths:
      - .github/workflows/android-debug-apk.yml

permissions:
  contents: read

concurrency:
  group: shytalk-01-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build localDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup project JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Generate isolated local Firebase emulator configuration
        uses: ./.github/actions/decode-google-services
        with:
          include-local: 'true'
      - name: Build localDebug APK only
        env:
          LIVEKIT_URL: ''
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleLocalDebug --stacktrace --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ShyTalk-01-local-debug-apk
          path: app/build/outputs/apk/local/debug/*.apk
          if-no-files-found: error
          retention-days: 14
